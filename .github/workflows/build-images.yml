name: Create and publish docker images

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 00 * * 0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Get SaltStack release versions
        id: gather-salt-releases-matrix
        run: .github/scripts/get-salt-releases-matrix.py

    outputs:
      salt-matrix: ${{ steps.gather-salt-releases-matrix.outputs.salt-matrix }}

  build:
    runs-on: ubuntu-latest

    needs: gather

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix: ${{ fromJson(needs.gather.outputs.salt-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.salt }}
          build-args: SALT_VERSION=${{ matrix.salt }}
          platforms: linux/amd64,linux/arm64
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
